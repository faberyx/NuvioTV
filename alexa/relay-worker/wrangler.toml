name = "nuvio-alexa-relay"
main = "src/index.ts"
compatibility_date = "2026-10-01"

[observability]
enabled = true

[[durable_objects.bindings]]
name = "RELAY"
class_name = "TvRelay"

# SQLite-backed Durable Objects are available on the Workers Free plan.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["TvRelay"]

[vars]
# Alexa developer console -> your skill -> "Copy Skill ID"
ALEXA_SKILL_ID = "amzn1.ask.skill.REPLACE-ME"

# TV_TOKEN is a secret: `npx wrangler secret put TV_TOKEN`
